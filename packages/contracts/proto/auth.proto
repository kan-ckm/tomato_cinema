syntax = "proto3";

// khai báo địa chỉ auth.v1
package auth.v1;

import "google/protobuf/empty.proto"; 

service AuthService {
    // Nhóm tính năng Xác thực bằng Email & Mật khẩu
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc VerifyEmail(VerifyEmailRequest) returns (AuthResponse);
    rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse);
    rpc Login(LoginRequest) returns (AuthResponse);
    rpc Refresh(RefreshRequest) returns (RefreshResponse);

    // Nhóm tính năng Quản lý mật khẩu qua Email (Mở rộng)
    rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
    rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
    
    // Nhóm tính năng Đăng nhập qua Telegram SSO
    rpc TelegramInit(google.protobuf.Empty) returns (TelegramInitResponse);
    rpc TelegramVerify(TelegramVerifyRequest) returns (TelegramVerifyResponse);
    rpc TelegramComplete(TelegramCompleteRequest) returns (TelegramCompleteResponse);
    rpc TelegramConsume(TelegramConsumeRequest) returns (TelegramConsumeResponse);
}

// Định nghĩa cấu trúc dữ liệu (DTO) cho Request và Response khi các Microservices giao tiếp với nhau
message RegisterRequest {
    string email = 1;
    string password = 2;
}

message RegisterResponse {
    bool ok = 1;
    string message = 2;
    string email = 3;
}

message VerifyEmailRequest {
    string email = 1;
    string code = 2;
}

message ResendVerificationRequest {
    string email = 1;
}

message ResendVerificationResponse {
    bool ok = 1;
    string message = 2;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message AuthResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message RefreshRequest {
    string refresh_token = 1;
}

message RefreshResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message ForgotPasswordRequest {
    string email = 1;
}

message ForgotPasswordResponse {
    bool ok = 1;
}

message ResetPasswordRequest {
    string email = 1;
    string code = 2;
    string new_password = 3;
}

message ResetPasswordResponse {
    bool ok = 1;
}

message ChangePasswordRequest {
    string user_id = 1;
    string current_password = 2;
    string new_password = 3;
}

message ChangePasswordResponse {
    bool ok = 1;
}

message TelegramInitResponse {
    string url = 1;
}

message TelegramVerifyRequest {
    map<string, string> query = 1;
}

message TelegramVerifyResponse {
    oneof result {
        string url = 1;
        string access_token = 2;
        string refresh_token = 3;
    }
}

message TelegramCompleteRequest {
    string session_id = 1;
    string phone = 2;
}

message TelegramCompleteResponse {
    string session_id = 1;
}

message TelegramConsumeRequest {
    string session_id = 1;
}

message TelegramConsumeResponse {
    string access_token = 1;
    string refresh_token = 2;
}