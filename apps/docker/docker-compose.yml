
services:

  postgres:
    container_name: postgres_tomato_cinema
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tomatocinema

  rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq-tomato_cinema
        restart: always
        ports:
          - "5673:5672"
          - "15673:15672"
        environment:
          RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
          RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD}
        volumes:
          - rabbitmq_data:/var/lib/rabbitmq
        networks:
          - tomatocinema

  redis:
    container_name: redis_tomato_cinema
    image: redis:8
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - tomatocinema
volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:

networks:
    tomatocinema:
  