# ==============================================================================
# CÁC MICROSERVICES BACKEND (AUTH, USER, GATEWAY, NOTIFICATION, BOT, MEDIA) & REVERSE PROXY
# Vị trí: docker/apps/docker-compose.yml
#
# File .env: docker/apps/.env (biến app + biến kết nối hạ tầng)
#
# Cách chạy độc lập (hạ tầng phải đã chạy trước):
#   cd docker/apps && docker compose up -d
# ==============================================================================

name: tomato-cinema

# ------------------------------------------------------------------------------
# 🧩 KHAI BÁO CẤU HÌNH TÁI SỬ DỤNG (YAML EXTENSION FIELDS & ANCHORS)
# ------------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  tomatocinema:
    name: tomato-cinema_tomatocinema
    driver: bridge

services:
  auth-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: auth-service
    image: tomato-cinema/auth-service:latest
    container_name: auth_service_tomato_cinema
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/auth?schema=public
      - DATABASE_HOST=postgres
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=auth
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - RMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      - GRPC_AUTH_HOST=0.0.0.0
      - GRPC_AUTH_PORT=${AUTH_GRPC_PORT}
      - GRPC_USER_HOST=user-service
      - GRPC_USER_PORT=${USER_GRPC_PORT}
      - PASSPORT_SECRET_KEY=${PASSPORT_SECRET_KEY}
      - PASSPORT_ACCESS_TTL=${PASSPORT_ACCESS_TTL}
      - PASSPORT_REFRESH_TTL=${PASSPORT_REFRESH_TTL}
      - TELEGRAM_BOT_ID=${TELEGRAM_BOT_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_REDIRECT_ORIGIN=${TELEGRAM_REDIRECT_ORIGIN}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    expose:
      - '9101'
    networks:
      - tomatocinema
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${AUTH_GRPC_PORT} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  user-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: user-service
    image: tomato-cinema/user-service:latest
    container_name: user_service_tomato_cinema
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=users
      - DATABASE_USER=users
      - DATABASE_LOGGING=${DATABASE_LOGGING:-false}
      - DATABASE_SYNC=${DATABASE_SYNC:-true}
      - RMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      - RMQ_QUEUE=users_queue
      - GRPC_USER_HOST=0.0.0.0
      - GRPC_USER_PORT=${USER_GRPC_PORT}
      - GRPC_AUTH_HOST=auth-service
      - GRPC_AUTH_PORT=${AUTH_GRPC_PORT}
      - AUTH_GRPC_URL=auth-service:${AUTH_GRPC_PORT}
    ports:
      - "${USER_GRPC_PORT}:${USER_GRPC_PORT}"
    networks:
      - tomatocinema
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${USER_GRPC_PORT} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  gateway-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: gateway-service
    image: tomato-cinema/gateway-service:latest
    container_name: gateway_service_tomato_cinema
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - HTTP_PORT=${GATEWAY_HTTP_PORT}
      - HTTP_HOST=${HTTP_HOST:-http://localhost}
      - HTTP_CORS=${HTTP_CORS:-http://localhost:3000}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - AUTH_GRPC_URL=auth-service:${AUTH_GRPC_PORT}
      - ACCOUNT_GRPC_URL=auth-service:${AUTH_GRPC_PORT}
      - USERS_GRPC_URL=user-service:${USER_GRPC_PORT}
      - MEDIA_GRPC_URL=media-service:${MEDIA_GRPC_PORT:-50059}
      - PASSPORT_SECRET_KEY=${PASSPORT_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "${GATEWAY_HTTP_PORT}:${GATEWAY_HTTP_PORT}"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - tomatocinema
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${GATEWAY_HTTP_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  notification-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: notification-service
    image: tomato-cinema/notification-service:latest
    container_name: notification_service_tomato_cinema
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - RMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:${RABBITMQ_PORT}
      - RMQ_QUEUE=${RMQ_QUEUE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - SMTP_SECURE=${SMTP_SECURE}
      - EXOLVE_API_KEY=${EXOLVE_API_KEY}
      - EXOLVE_SENDER=${EXOLVE_SENDER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    expose:
      - '9102'
    networks:
      - tomatocinema
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9102/metrics || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  bot-service:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: bot-service
    image: tomato-cinema/bot-service:latest
    container_name: bot_service_tomato_cinema
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - AUTH_GRPC_URL=auth-service:${AUTH_GRPC_PORT}
      - BOT_TOKEN=${TELEGRAM_BOT_ID}:${TELEGRAM_BOT_TOKEN}
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - tomatocinema
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  media-service:
    build:
      context: ../..
      dockerfile: docker/media.Dockerfile
    image: tomato-cinema/media-service:latest
    container_name: media_service_tomato_cinema
    restart: unless-stopped
    environment:
      - APP_ENV=${MEDIA_APP_ENV:-production}
      - HTTP_PORT=${MEDIA_HTTP_PORT:-4200}
      - HTTP_HOST=${MEDIA_PUBLIC_URL:-http://localhost:8080/media}
      - GRPC_PORT=${MEDIA_GRPC_PORT:-50059}
      - GRPC_MAX_MSG_MB=${MEDIA_GRPC_MAX_MSG_MB:-16}
      - S3_DRIVER=s3
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - LOG_LEVEL=${MEDIA_LOG_LEVEL:-info}
    expose:
      - '4200'
      - '50059'
    networks:
      - tomatocinema
    healthcheck:
      test: ["CMD", "/media-service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: reverse_proxy_tomato_cinema
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - tomatocinema
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
