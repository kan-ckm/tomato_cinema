# ==============================================================================
# CẤU HÌNH GỐC NGINX (CORE CONFIGURATION)
# Vị trí: docker/nginx/nginx.conf
# Mục đích: Thiết lập tài nguyên tiến trình, tối ưu mạng, nén Gzip và khai báo các vùng Rate Limit
# ==============================================================================

# User mà tiến trình Nginx worker sẽ chạy dưới quyền (bảo mật, không dùng root)
user nginx;

# Số lượng tiến trình xử lý (worker processes). 
# 'auto' sẽ tự động phát hiện số lượng core CPU của máy để tận dụng tối đa đa nhân.
worker_processes auto;

# Đường dẫn ghi log lỗi và mức độ ghi log (warn: cảnh báo trở lên)
error_log /var/log/nginx/error.log warn;

# File lưu mã định danh tiến trình chính (Process ID)
pid /var/run/nginx.pid;

# ------------------------------------------------------------------------------
# KHỐI EVENTS: Cấu hình cách thức xử lý kết nối mạng
# ------------------------------------------------------------------------------
events {
    # Số lượng kết nối đồng thời tối đa mà 1 tiến trình worker có thể phục vụ.
    # Tổng kết nối đồng thời tối đa = worker_processes * worker_connections.
    worker_connections 1024;
}

# ------------------------------------------------------------------------------
# KHỐI HTTP: Cấu hình giao thức HTTP, định dạng log, tối ưu I/O và bảo vệ hệ thống
# ------------------------------------------------------------------------------
http {
    # Nạp danh sách các kiểu file mở rộng (MIME types: .html, .css, .json, .js,...)
    include /etc/nginx/mime.types;
    # Kiểu dữ liệu mặc định nếu Nginx không xác định được loại file
    default_type application/octet-stream;

    # Định nghĩa cấu trúc dòng ghi log truy cập (access log)
    # $remote_addr: IP client gửi tới
    # $status: Mã phản hồi HTTP (200, 400, 429, 500,...)
    # rt=$request_time: Tổng thời gian Nginx xử lý xong 1 request (tính bằng giây/mili-giây)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    # Nơi lưu trữ nhật ký truy cập
    access_log /var/log/nginx/access.log main;

    # --- TỐI ƯU HÓA HIỆU NĂNG MẠNG & TRUYỀN DỮ LIỆU (ZERO-COPY) ---
    # Bật sendfile: Cho phép truyền dữ liệu trực tiếp từ đĩa cứng ra socket mạng ở tầng kernel,
    # bỏ qua bước nạp file vào bộ nhớ ứng dụng -> giảm tải CPU đáng kể.
    sendfile on;

    # Gộp các gói tin TCP header và data lại để gửi một lần, giảm phân mảnh gói tin trên đường truyền
    tcp_nopush on;

    # Tắt thuật toán Nagle (gửi dữ liệu ngay lập tức không đợi gom buffer) -> giảm độ trễ (latency)
    tcp_nodelay on;

    # Thời gian (giây) duy trì kết nối TCP mở với client để tái sử dụng cho các request sau
    keepalive_timeout 65;

    # Kích thước bảng băm MIME types trong bộ nhớ
    types_hash_max_size 2048;

    # --- NÉN DỮ LIỆU GZIP (TIẾT KIỆM BĂNG THÔNG) ---
    # Bật tính năng nén phản hồi trước khi gửi về client
    gzip on;
    # Tắt gzip đối với các trình duyệt quá cũ không hỗ trợ tốt (Internet Explorer 6)
    gzip_disable "msie6";
    # Thêm header 'Vary: Accept-Encoding' để các proxy trung gian cache đúng phiên bản
    gzip_vary on;
    # Cho phép nén cả khi request đi qua proxy
    gzip_proxied any;
    # Mức độ nén từ 1 (nhẹ/nhanh) đến 9 (nén tối đa/tốn CPU). Mức 6 là mức tối ưu nhất.
    gzip_comp_level 6;
    # Các định dạng nội dung sẽ được nén (chỉ nên nén dạng văn bản/code, không nén ảnh/video)
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==============================================================================
    # KHAI BÁO CÁC VÙNG RATE LIMITING (GIỚI HẠN TẦN SUẤT THEO IP)
    # Cú pháp: limit_req_zone [key] zone=[tên_vùng]:[kích_thước_ram] rate=[tốc_độ];
    #
    # Giải thích tham số:
    # - $binary_remote_addr: Địa chỉ IP của client dưới dạng nhị phân (chỉ tốn 4 bytes cho IPv4 hoặc 16 bytes cho IPv6),
    #   tiết kiệm RAM gấp nhiều lần so với lưu chuỗi IP dạng chữ '$remote_addr'.
    # - 10m: Dành 10 Megabytes RAM để lưu trữ trạng thái các IP (10MB chứa được khoảng 160.000 IP khác nhau).
    # - r/m: Requests per minute (số lượng request tối đa trong 1 phút).
    # ==============================================================================

    # Vùng 1: Chung cho toàn bộ API (Giới hạn tối đa 100 request / phút trên mỗi IP)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;

    # Vùng 2: Nhạy cảm - Đăng nhập / Đăng ký (Giới hạn tối đa 10 request / phút trên mỗi IP chống Brute-force mật khẩu)
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;

    # Vùng 3: Cực kỳ nhạy cảm - Gửi OTP, Đổi mật khẩu, Đổi Email (Giới hạn 1 request / phút chống Spam OTP)
    limit_req_zone $binary_remote_addr zone=otp_strict:10m rate=1r/m;

    # Thiết lập mã trạng thái HTTP trả về khi client vi phạm vượt quá ngưỡng (429: Too Many Requests)
    limit_req_status 429;

    # Nạp toàn bộ các file cấu hình máy chủ ảo (Virtual Host / Server blocks) từ thư mục conf.d
    include /etc/nginx/conf.d/*.conf;
}
