# ==============================================================================
# ĐỊNH NGHĨA MÁY CHỦ ẢO & ĐỊNH TUYẾN REVERSE PROXY
# Vị trí: docker/nginx/conf.d/default.conf
# Mục đích: Đón request từ bên ngoài, áp dụng Rate Limit theo từng endpoint và proxy vào Gateway
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. KHỐI UPSTREAM: Khai báo cụm dịch vụ đích phía sau (Backend Gateway)
# ------------------------------------------------------------------------------
upstream gateway_upstream {
    # Tên container trong mạng Docker: 'gateway-service' và cổng lắng nghe HTTP: 4000
    server gateway-service:4000;

    # Duy trì sẵn 32 kết nối TCP nhàn rỗi (idle connection pool) giữa Nginx và Gateway.
    # Giúp Nginx không phải thực hiện bắt tay 3 bước (TCP 3-way handshake) lại từ đầu cho mỗi request -> giảm độ trễ cực lớn.
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. KHỐI SERVER: Cấu hình Virtual Host
# ------------------------------------------------------------------------------
server {
    # Cổng mà Nginx lắng nghe bên trong container (kết nối ra cổng 80/8080 của máy chủ host)
    listen 80;
    server_name localhost;

    # Giới hạn kích thước tối đa của Body trong request gửi lên (chống tấn công làm tràn RAM bằng file dung lượng khổng lồ)
    # 10M phù hợp cho việc tải ảnh đại diện (avatar), form dữ liệu,...
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # TÙY BIẾN TRẢ VỀ JSON KHI BỊ CHẶN RATE LIMIT (HTTP 429)
    # Thay vì trả về trang HTML 429 mặc định của Nginx, ta chuyển hướng sang một
    # named location (@rate_limited) để trả về đúng format JSON của NestJS API.
    # --------------------------------------------------------------------------
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"statusCode":429,"message":"Thao tác quá nhanh. Vui lòng thử lại sau.","error":"Too Many Requests"}';
    }

    # --------------------------------------------------------------------------
    # THIẾT LẬP CÁC HEADER CHUYỂN TIẾP (REVERSE PROXY HEADERS)
    # Giúp backend Gateway phía sau biết được thông tin thực của Client đang gọi tới
    # --------------------------------------------------------------------------
    # Sử dụng giao thức HTTP/1.1 để hỗ trợ keepalive connection với upstream
    proxy_http_version 1.1;

    # Xóa header Connection hop-by-hop để hỗ trợ duy trì kết nối keepalive
    proxy_set_header Connection "";

    # Chuyển tiếp domain/host gốc mà người dùng gõ trên trình duyệt vào backend
    proxy_set_header Host $host;

    # Gửi IP thật của người dùng vào header 'X-Real-IP' (thay vì IP nội bộ của Nginx)
    proxy_set_header X-Real-IP $remote_addr;

    # Danh sách các IP mà request đã đi qua (hỗ trợ trường hợp đi qua nhiều tầng proxy/Cloudflare)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Chuyển tiếp giao thức (http hoặc https) để backend biết client dùng giao thức nào
    proxy_set_header X-Forwarded-Proto $scheme;

    # ==========================================================================
    # CÁC LOCATION RULES (ĐỊNH TUYẾN & ÁP DỤNG RATE LIMITING)
    # Lưu ý: Nginx ưu tiên kiểm tra Regular Expression (~*) trước các tiền tố thông thường.
    #
    # Giải thích tham số Rate Limit:
    # - zone=...   : Chọn vùng giới hạn đã khai báo ở nginx.conf.
    # - burst=N    : Cho phép một hàng đợi (buffer) chứa tối đa N request vượt ngưỡng tạm thời.
    # - nodelay    : Xử lý ngay lập tức các request trong hàng đợi burst, không bắt client phải chờ,
    #                nhưng nếu vượt quá cả ngưỡng burst thì NGẮT VÀ TRẢ 429 NGAY LẬP TỨC.
    # ==========================================================================

    # --- RULE 1: CỰC KỲ NGHIÊM NGẶT - GỬI OTP & THAO TÁC BẢO MẬT TÀI KHOẢN ---
    # Tần suất: 1 request / phút (burst: 2). Chống spam gửi mail OTP làm tốn tiền SMS/Mailtrap và nghẽn hệ thống.
    # Áp dụng cho: /api/v1/account/init-password-change, confirm-password-change, đổi email, đổi số điện thoại...
    location ~* ^/api/v1/account/(init-password-change|confirm-password-change|init-email-change|confirm-email-change|init-phone-change|confirm-phone-change) {
        limit_req zone=otp_strict burst=2 nodelay;
        proxy_pass http://gateway_upstream;
    }

    # Áp dụng cho endpoint gửi OTP đăng nhập/xác thực
    location ~* ^/api/v1/auth/otp {
        limit_req zone=otp_strict burst=2 nodelay;
        proxy_pass http://gateway_upstream;
    }

    # --- RULE 2: NGHIÊM NGẶT - ĐĂNG NHẬP, ĐĂNG KÝ, QUÊN MẬT KHẨU ---
    # Tần suất: 10 request / phút (burst: 5). Chống Brute-force mật khẩu và tạo tài khoản ảo tự động bằng bot.
    location ~* ^/api/v1/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_strict burst=5 nodelay;
        proxy_pass http://gateway_upstream;
    }

    # --- RULE 3: NGOẠI LỆ - TÀI LIỆU SWAGGER & OBSERVABILITY METRICS ---
    # Không áp dụng rate limit cho trang xem tài liệu API (/docs) và cổng cào metrics giám sát (/metrics)
    location ~* ^/(docs|metrics) {
        proxy_pass http://gateway_upstream;
    }

    # --- RULE 4: MẶC ĐỊNH - TOÀN BỘ CÁC API KHÁC CỦA HỆ THỐNG ---
    # Tần suất: 100 request / phút (burst: 20). Phục vụ các thao tác xem phim, duyệt danh mục, đọc thông tin cá nhân.
    location / {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://gateway_upstream;
    }
}
