user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (Keyed by client IP)
    # Zone 1: Default general API (100 req/min)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;

    # Zone 2: Sensitive Auth (Login, Register: 10 req/min)
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;

    # Zone 3: OTP & Critical security flows (1 req/min)
    limit_req_zone $binary_remote_addr zone=otp_strict:10m rate=1r/m;

    # Return standard HTTP 429 Too Many Requests when limit exceeded
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
