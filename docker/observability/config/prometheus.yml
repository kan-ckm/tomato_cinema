# ==============================================================================
# 📈 CẤU HÌNH PROMETHEUS METRICS SCRAPING
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Cào metrics từ chính Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Cào metrics từ OpenTelemetry Collector (chứa metrics của các apps NestJS)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Cào metrics từ PostgreSQL Exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Cào metrics từ Redis Exporter
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Cào metrics từ RabbitMQ Prometheus plugin tích hợp sẵn
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
